    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        #app { max-width: 900px; width: 100%; background: #ffffff; border-radius: 20px; padding: 30px 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .timer { position: sticky; top: 0; background: #fff; z-index: 10; padding: 8px 0; text-align: right; font-size: 18px; font-weight: bold; color: #1a2a4a; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; transition: color 0.3s, border-color 0.3s; }
        .timer.warning { color: #dc2626; border-bottom-color: #fee2e2; }
        .timer.critical { color: #dc2626; border-bottom-color: #fee2e2; animation: blink 1s infinite; }
        .timer.shake { animation: shake 0.5s ease-out; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes shake { 0%, 100% { transform: scale(1.2) rotate(0deg); } 25% { transform: scale(1.2) rotate(-3deg); } 50% { transform: scale(1.2) rotate(3deg); } 75% { transform: scale(1.2) rotate(-2deg); } }
        .highlight { color: #dc2626; font-weight: bold; }
        .instruction-box { background: #f0f7ff; border-left: 5px solid #3b7cff; padding: 18px 24px; border-radius: 8px; margin: 12px 0 20px 0; font-size: 15px; line-height: 1.8; color: #1a2a4a; }
        .warning-box { background: #fff3cd; border-left: 5px solid #ffc107; padding: 14px 20px; border-radius: 8px; margin: 12px 0; font-size: 14px; line-height: 1.6; }
        .btn { background: #3b7cff; color: #fff; border: none; border-radius: 10px; padding: 12px 36px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s; margin: 8px 4px; }
        .btn:hover { background: #2a5fc7; }
        .btn-secondary { background: #e2e8f0; color: #1a2a4a; }
        .text-center { text-align: center; }
        .mt-20 { margin-top: 20px; }
        .dynamic-input-container input[type="text"],
        .dynamic-input-container textarea { display: block !important; width: 100% !important; padding: 12px 16px !important; margin: 6px 0 !important; border: 1.5px solid #d0d7de; border-radius: 8px; font-size: 15px; background: #fafbfc; transition: border-color 0.2s; font-family: inherit; box-sizing: border-box; height: auto; min-height: 48px; line-height: 1.5; }
        .dynamic-input-container input[type="text"]:focus,
        .dynamic-input-container textarea:focus { border-color: #3b7cff; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(59,124,255,0.12); }
        .dynamic-input-container textarea { min-height: 80px; resize: vertical; }
        .rat-grid { display: grid; gap: 12px; margin: 12px 0; }
        .rat-item { display: flex; align-items: center; gap: 16px; padding: 8px 12px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; flex-wrap: wrap; }
        .rat-item .clues { font-size: 22px; font-weight: 600; letter-spacing: 6px; min-width: 100px; color: #0b1e3a; }
        .rat-item input[type="text"] { flex: 1; padding: 8px 14px; border: 1.5px solid #d0d7de; border-radius: 6px; font-size: 18px; text-align: center; background: #fff; min-width: 60px; }
        .rat-item input[type="text"]:focus { border-color: #3b7cff; outline: none; box-shadow: 0 0 0 3px rgba(59,124,255,0.12); }
        .rat-item .qnum { font-size: 14px; color: #6b7a8f; min-width: 30px; }
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; }
        .matrix-table th, .matrix-table td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; vertical-align: middle; }
        .matrix-table th { background: #f1f5f9; font-weight: 600; color: #1a2a4a; }
        .matrix-table td:first-child { text-align: left; padding-left: 12px; background: #fafbfc; font-weight: 500; }
        .matrix-table td .radio-cell { display: inline-block; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d0d7de; cursor: pointer; transition: all 0.2s; position: relative; }
        .matrix-table td .radio-cell.selected { border-color: #3b7cff; background: #3b7cff; }
        .matrix-table td .radio-cell.selected::after { content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; background: #fff; border-radius: 50%; }
        .matrix-table td .radio-cell input[type="radio"] { display: none; }
        .question-block { padding: 12px 0; border-bottom: 1px solid #edf2f7; }
        .question-block:last-child { border-bottom: none; }
        .question-text { font-size: 15px; line-height: 1.6; color: #1a2a4a; margin-bottom: 6px; }
        .question-text .qnum { display: inline-block; background: #eef3fc; color: #1a4b8c; font-weight: 600; font-size: 13px; padding: 2px 12px; border-radius: 12px; margin-right: 8px; }
        .options-row { display: flex; flex-wrap: wrap; gap: 10px 20px; padding-left: 8px; }
        .options-row label { font-size: 14px; color: #2d3748; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .options-row input[type="radio"] { width: 16px; height: 16px; accent-color: #3b7cff; cursor: pointer; }
        .bonus-input { margin: 6px 0 6px 28px; padding: 8px 14px; border: 1.5px solid #d0d7de; border-radius: 8px; width: 90%; font-size: 14px; }
        .sig-combo { background: #f2f6fe; padding: 14px 20px; border-radius: 10px; margin: 10px 0; display: flex; flex-wrap: wrap; gap: 12px 24px; font-size: 15px; }
        .progress-bar { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 16px 0 8px 0; overflow: hidden; }
        .progress-bar .fill { height: 100%; background: #3b7cff; width: 0%; transition: width 0.3s ease; }
        .progress-text { text-align: right; font-size: 13px; color: #8a9aa8; }
        .data-output { background: #1e293b; color: #e2e8f0; padding: 16px 20px; border-radius: 10px; font-family: "Consolas", monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; margin: 12px 0; }
        @media (max-width: 600px) {
            #app { padding: 20px 16px; }
            .rat-item { flex-wrap: wrap; gap: 8px; }
            .rat-item .clues { font-size: 18px; min-width: 70px; letter-spacing: 4px; }
            .matrix-table { font-size: 12px; }
            .matrix-table th, .matrix-table td { padding: 4px 2px; }
        }
        .form-group { margin: 16px 0; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1.5px solid #d0d7de; border-radius: 8px; font-size: 15px; }
    </style>
</head>

    function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

    function generateTaskOrder() {
        const aTasks = ['aut_instruction', 'rat_instruction', 'fit_instruction'];
        const bTasks = ['ccaq_instruction', 'kdocs_instruction', 'mcps_instruction'];
        shuffle(aTasks);
        shuffle(bTasks);
        const order = [];
        for (let i = 0; i < Math.min(aTasks.length, bTasks.length); i++) {
            order.push(aTasks[i], bTasks[i]);
        }
        state.taskOrder = order;
        state.taskIndex = 0;
        state.taskOrderList = order.map(s => s.replace('_instruction', ''));
    }

    function prepareFITTasks() {
        const personal = fitData.filter(d => d.type === 'personal');
        const social = fitData.filter(d => d.type === 'social');
        shuffle(personal); shuffle(social);
        const chosenPersonal = personal.slice(0, 2);
        const chosenSocial = social.slice(0, 2);
        const startWithPersonal = Math.random() < 0.5;
        const tasks = [];
        const pairs = [ { p: chosenPersonal[0], s: chosenSocial[0] }, { p: chosenPersonal[1], s: chosenSocial[1] } ];
        pairs.forEach(pair => {
            if (startWithPersonal) {
                tasks.push({ type: 'FIT', subtype: 'personal', data: pair.p });
                tasks.push({ type: 'FIT', subtype: 'social', data: pair.s });
            } else {
                tasks.push({ type: 'FIT', subtype: 'social', data: pair.s });
                tasks.push({ type: 'FIT', subtype: 'personal', data: pair.p });
            }
        });
        state.fitTasks = tasks;
        state.fitTaskIndex = 0;
        state.fitPhase = 'required';
        state.fitExtraPersonal = personal.filter(d => !chosenPersonal.includes(d));
        state.fitExtraSocial = social.filter(d => !chosenSocial.includes(d));
    }

    function generateDailyPassword() {
        const now = new Date();
        const year = now.getFullYear().toString();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateStr = year + month + day;
        const plusOne = dateStr.split('').map(d => (parseInt(d) + 1) % 10).join('');
        const front7 = plusOne.substring(0, 7);
        const lastDigit = plusOne[7];
        const secret = 'zhangyw';
        let transformed = '';
        for (let i = 0; i < 7; i++) {
            const digit = parseInt(front7[i]);
            const keyVal = secret[i].charCodeAt(0) - 97;
            transformed += String.fromCharCode((digit + keyVal) % 26 + 97);
        }
        return transformed + lastDigit;
    }

    function startTimer(seconds, onTimeout) {
        stopTimer();
        state.timeRemaining = seconds;
        state.timerStart = performance.now();
        state.timeLimit = seconds;
        state.shakeTriggered = false;
        updateTimerDisplay();
        function tick() {
            const elapsed = (performance.now() - state.timerStart) / 1000;
            const remaining = Math.max(0, state.timeLimit - elapsed);
            state.timeRemaining = remaining;
            updateTimerDisplay();
            if (remaining <= 0) { stopTimer(); if (onTimeout) onTimeout(); return; }
            state.timerRAF = requestAnimationFrame(tick);
        }
        state.timerRAF = requestAnimationFrame(tick);
    }
    function stopTimer() { if (state.timerRAF) { cancelAnimationFrame(state.timerRAF); state.timerRAF = null; } }
    function updateTimerDisplay() {
        const el = document.getElementById('timer-display');
        if (!el) return;
        const mins = Math.floor(state.timeRemaining / 60);
        const secs = Math.floor(state.timeRemaining % 60);
        el.textContent = `⏱ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        el.classList.remove('warning', 'critical', 'shake');
        if (state.timeRemaining <= 10) {
            if (!state.shakeTriggered) {
                state.shakeTriggered = true;
                el.classList.add('shake');
                setTimeout(() => { el.classList.remove('shake'); el.classList.add('critical'); }, 500);
            } else { el.classList.add('critical'); }
        } else if (state.timeRemaining < 30) { el.classList.add('warning'); }
    }

    function setupDynamicInput(containerId, tagName, placeholderBase, initialCount = 1) {
        const container = document.getElementById(containerId);
        if (!container) return container;
        let isComposing = false;
        container.innerHTML = '';
        state.currentTaskTiming = { firstInput: null, lastInput: null, submitTime: null, inputs: [] };
        for (let i = 0; i < initialCount; i++) {
            const el = document.createElement(tagName);
            if (tagName === 'input') el.type = 'text'; else el.rows = 3;
            el.placeholder = `${placeholderBase} ${i+1}...`;
            el.className = tagName === 'input' ? 'aut-input' : 'sig-textarea';
            container.appendChild(el);
            attachInputListeners(el, i);
        }
        container.querySelector(tagName)?.focus();

        function addInput() {
            const inputs = container.querySelectorAll(tagName);
            const last = inputs[inputs.length-1];
            if (last && last.value.trim() !== '') {
                const idx = inputs.length;
                const el = document.createElement(tagName);
                if (tagName === 'input') el.type = 'text'; else el.rows = 3;
                el.placeholder = `${placeholderBase} ${idx+1}...`;
                el.className = tagName === 'input' ? 'aut-input' : 'sig-textarea';
                container.appendChild(el);
                attachInputListeners(el, idx);
                setTimeout(() => el.focus(), 30);
            }
        }

        function attachInputListeners(el, idx) {
            if (!state.currentTaskTiming.inputs[idx]) {
                state.currentTaskTiming.inputs[idx] = { firstKey: null, lastKey: null, charCount: 0, events: [] };
            }
            const data = state.currentTaskTiming.inputs[idx];

            el.addEventListener('keydown', () => {
                const now = Date.now();
                if (!state.currentTaskTiming.firstInput) state.currentTaskTiming.firstInput = now;
                if (!data.firstKey) data.firstKey = now;
            });
            el.addEventListener('input', () => {
                const now = Date.now();
                state.currentTaskTiming.lastInput = now;
                data.lastKey = now;
                data.charCount = el.value.length;
                data.events.push({
                    time: now,
                    charCount: el.value.length,
                    text: el.value
                });
            });
        }

        container.addEventListener('compositionstart', ()=> isComposing=true);
        container.addEventListener('compositionend', ()=> isComposing=false);
        container.addEventListener('keydown', e => {
            if (e.key==='Enter' && e.target.tagName===tagName.toUpperCase()) {
                if (isComposing) return;
                e.preventDefault();
                const inputs = container.querySelectorAll(tagName);
                const last = inputs[inputs.length-1];
                if (e.target===last && last.value.trim()!=='') addInput();
                else { const idx = Array.from(inputs).indexOf(e.target); if (idx < inputs.length-1) inputs[idx+1].focus(); }
            }
        });
        return container;
    }

        };
    }

    window.onCCAQChange = function(di) {
        const radios = document.querySelectorAll(`input[name="ccaq_${di}_0"]`);
        let val = null; radios.forEach(r => { if (r.checked) val = r.value; });
        const subs = document.querySelectorAll(`.ccaq-sub-${di}`);
        if (val === '是') {
            let hasPositive = false;
            for (let i = 1; i < ccaqData[di].items.length; i++) {
                const subRadios = document.querySelectorAll(`input[name="ccaq_${di}_${i}"]`);
                subRadios.forEach(r => { if (r.checked && r.value === '是') hasPositive = true; });
                const bonusInput = document.querySelector(`#ccaq-bonus-${di}-${i} input`);
                if (bonusInput && bonusInput.value.trim() !== '') hasPositive = true;
            }
            if (hasPositive) {
                alert('后续题目已有肯定回答或填写了具体次数，不能更改为“是”。');
                radios.forEach(r => r.checked = false);
                return;
            }
            subs.forEach(el => el.style.display = 'none');
        } else if (val === '否') {
            subs.forEach(el => el.style.display = 'block');
        }
    };
    window.onCCAQBonus = function(di, qi) {
        const radios = document.querySelectorAll(`input[name="ccaq_${di}_${qi}"]`);
        let val = null; radios.forEach(r => { if (r.checked) val = r.value; });
        const bonusDiv = document.getElementById(`ccaq-bonus-${di}-${qi}`);
        if (bonusDiv) bonusDiv.style.display = (val === '是') ? 'block' : 'none';
    };
    window.submitCCAQ = function(di) {
        const domain = ccaqData[di];
        const q0Radios = document.querySelectorAll(`input[name="ccaq_${di}_0"]`);
        let q0Val = null; q0Radios.forEach(r => { if (r.checked) q0Val = r.value; });
        if (!q0Val) { alert('请回答第0题'); return; }
        const timing = finalizeCCAQTiming();
        if (q0Val === '是') {
            state.results.ccaq.push({ domain: domain.domain, q_index: 0, value: '是（无才能）', bonus_text: '', timing });
            state.ccaqIndex++; renderCCAQTask(); return;
        }
        for (let i = 1; i < domain.items.length; i++) {
            const radios = document.querySelectorAll(`input[name="ccaq_${di}_${i}"]`);
            let val = null; radios.forEach(r => { if (r.checked) val = r.value; });
            if (!val) { alert(`请回答第 ${i} 题`); return; }
            let bonusText = '';
            if (val === '是' && domain.bonusIndices.includes(i)) {
                const bonusInput = document.querySelector(`#ccaq-bonus-${di}-${i} input`);
                if (bonusInput) {
                    bonusText = bonusInput.value.trim();
                    if (bonusText === '') { alert('请填写这一情况发生过几次？'); return; }
                    if (!/^-?\d+$/.test(bonusText)) { alert('附加分请填写整数'); return; }
                }
            }
            state.results.ccaq.push({ domain: domain.domain, q_index: i, value: val, bonus_text: bonusText, timing });
        }
        state.ccaqIndex++; renderCCAQTask();
    };

    function initMatrixTiming(items) {
        state.pageEntryTime = Date.now();

            state.matrixItemTimings[item.id] = { firstClick: null, lastClick: null, changes: 0, clicks: [] };

    window.selectMatrix = function(name, value) {
        const row = document.querySelector(`[id^="${name}_"]`)?.closest('tr');
        if (row) row.querySelectorAll('.radio-cell').forEach(c => c.classList.remove('selected'));
        const el = document.getElementById(`${name}_${value}`);
        if (el) {
            el.classList.add('selected');
            if (!window._matrixData) window._matrixData = {};
            window._matrixData[name] = value;
            const id = parseInt(name.split('_')[1]);
            const now = Date.now();
            if (!state.matrixItemTimings[id]) {
                state.matrixItemTimings[id] = { firstClick: now, lastClick: now, changes: 0, clicks: [now] };
            } else {
                if (!state.matrixItemTimings[id].firstClick) state.matrixItemTimings[id].firstClick = now;
                state.matrixItemTimings[id].lastClick = now;
                state.matrixItemTimings[id].changes += 1;
                state.matrixItemTimings[id].clicks.push(now);
            }
        }
    };
    function finalizeMatrixTiming() { return { entryTime: state.pageEntryTime, items: { ...state.matrixItemTimings } }; }

    function renderKDOCSTask() {
        const totalPages = Math.ceil(kdocsData.length / 10);
        if (state.kdocsPage >= totalPages) { recordTaskEnd('真实的自己：生活与创造'); goToStep('next_task'); return; }
        const start = state.kdocsPage * 10;
        const end = Math.min(start+10, kdocsData.length);
        const items = kdocsData.slice(start, end);
        initMatrixTiming(items);
        let html = `<h2>真实的自己：生活与创造</h2><div style="background:#f0f7ff; padding:14px; border-radius:6px; margin-bottom:16px; font-size:14px; line-height:1.8;">与你的年龄和生活经验相似的人比较，你如何评价自己在以下行为上的创造性，即能灵活、有效地处理这些问题。如果这类事没有发生在你身上过，你可以根据类似的情况发生时你会怎么做来选择。<br>表中选项从1—5分别表示能够灵活、有效处理该情况的程度：1 表示与你年龄或生活经验相似的人在遇到该情况并进行应对时，灵活性、有效性最低的情况，5 则表示最高的情况。</div><p style="color:#6b7a8f;">第 ${state.kdocsPage+1}/${totalPages} 页</p><table class="matrix-table"><thead><tr><th style="min-width:200px;">题目</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>`;
        items.forEach(item => {
            html += `<tr><td>${item.id}. ${item.text}</td>`;
            for (let v=1; v<=5; v++) html += `<td onclick="selectMatrix('kdocs_${item.id}',${v})"><span class="radio-cell" id="kdocs_${item.id}_${v}"></span></td>`;
            html += `</tr>`;
        });
        html += `</tbody></table><div class="text-center mt-20"><button class="btn" onclick="submitKDOCSPage()">${state.kdocsPage===totalPages-1?'完成':'下一页'}</button></div>${renderProgress(state.kdocsPage+1, totalPages)}`;
        render(html);
    }
    window.submitKDOCSPage = function() {
        const start = state.kdocsPage * 10;
        const end = Math.min(start+10, kdocsData.length);
        const items = kdocsData.slice(start, end);
        const missed = [];
        items.forEach(item => {
            const key = `kdocs_${item.id}`;
            if (!window._matrixData?.[key]) missed.push(item.id);
        });
        if (missed.length > 0) { alert(`请回答第 ${missed.join('、')} 题`); return; }
        const timing = finalizeMatrixTiming();
        items.forEach(item => {
            const key = `kdocs_${item.id}`;
            state.results.kdocs.push({ id: item.id, dim: item.dim, value: window._matrixData[key], timing: timing.items[item.id] });
        });
        state.kdocsPage++;
        saveState();
        renderKDOCSTask();
    };

    function renderMCPSTask() {
        const totalPages = Math.ceil(mcpsData.length / 6);
        if (state.mcpsPage >= totalPages) { recordTaskEnd('真实的自己：思考方式'); goToStep('next_task'); return; }
        const start = state.mcpsPage * 6;
        const end = Math.min(start+6, mcpsData.length);
        const items = mcpsData.slice(start, end);
        initMatrixTiming(items);
        let html = `<h2>真实的自己：思考方式</h2><p style="color:#4a5a72; margin-bottom:8px;">共11题，请根据自身实际情况判断题项描述与你的符合程度。1 = 非常不符合，5 = 非常符合。</p><p style="color:#6b7a8f;">第 ${state.mcpsPage+1}/${totalPages} 页</p><table class="matrix-table"><thead><tr><th style="min-width:200px;">题目</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>`;
        items.forEach(item => {
            html += `<tr><td>${item.id}. ${item.text}</td>`;
            for (let v=1; v<=5; v++) html += `<td onclick="selectMatrix('mcps_${item.id}',${v})"><span class="radio-cell" id="mcps_${item.id}_${v}"></span></td>`;
            html += `</tr>`;
        });
        html += `</tbody></table><div class="text-center mt-20"><button class="btn" onclick="submitMCPSPage()">${state.mcpsPage===totalPages-1?'完成':'下一页'}</button></div>${renderProgress(state.mcpsPage+1, totalPages)}`;
        render(html);
    }
    window.submitMCPSPage = function() {
        const start = state.mcpsPage * 6;
        const end = Math.min(start+6, mcpsData.length);
        const items = mcpsData.slice(start, end);
        const missed = [];
        items.forEach(item => {
            const key = `mcps_${item.id}`;
            if (!window._matrixData?.[key]) missed.push(item.id);
        });
        if (missed.length > 0) { alert(`请回答第 ${missed.join('、')} 题`); return; }
        const timing = finalizeMatrixTiming();
        items.forEach(item => {
            const key = `mcps_${item.id}`;
            state.results.mcps.push({ id: item.id, dim: item.dim, value: window._matrixData[key], timing: timing.items[item.id] });
        });
        state.mcpsPage++;
        saveState();
        renderMCPSTask();
    };

    // ---------- 数据导出 ----------
    function showDataSummary() {
        const finalData = {
            subject_id: state.subjectId,
            demographics: state.demographics,
            task_order: state.taskOrderList,
            task_timings: state.taskTimings,
            ...state.results
        };
        const json = JSON.stringify(finalData, null, 2);
        render(`<h2>实验已完成</h2><p style="color:#4a5a72;margin-bottom:12px;">感谢参与！请下载数据。</p><div class="data-output">${json}</div><div class="text-center mt-20"><button class="btn" onclick="downloadData('json')">下载 JSON</button><button class="btn" onclick="downloadData('csv')">下载 CSV</button><button class="btn btn-secondary" onclick="copyData()">复制到剪贴板</button></div>`);
    }
    window.downloadData = function(format) {
        const finalData = {
            subject_id: state.subjectId,
            demographics: state.demographics,
            task_order: state.taskOrderList,
            task_timings: state.taskTimings,
            ...state.results
        };
        let content, filename, mime;
        const prefix = state.subjectId ? `subject_${state.subjectId}` : 'experiment';
        if (format === 'json') { content = JSON.stringify(finalData, null, 2); filename = `${prefix}_data.json`; mime = 'application/json'; }
        else {
            let csv = 'task,key,value\n';
            csv += `subject_id,${state.subjectId},\n`;
            Object.keys(state.results).forEach(task => {
                const arr = state.results[task];
                if (Array.isArray(arr)) arr.forEach((item, idx) => { csv += `${task},${idx},${JSON.stringify(item).replace(/,/g,';')}\n`; });
            });
            content = csv; filename = `${prefix}_data.csv`; mime = 'text/csv';
        }
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };
    window.copyData = function() {
        const finalData = {
            subject_id: state.subjectId,
            demographics: state.demographics,
            task_order: state.taskOrderList,
            task_timings: state.taskTimings,
            ...state.results
        };
        const json = JSON.stringify(finalData, null, 2);
        navigator.clipboard.writeText(json).then(() => alert('数据已复制')).catch(() => alert('请手动复制'));
    };

    // 启动
    initAUTOrder();
    showPasswordGate();
</script>
